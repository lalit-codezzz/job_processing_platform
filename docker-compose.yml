services:
  postgres:
    image: 'postgres:17'
    container_name: job-platform-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 'random123'
      POSTGRES_DB: job_platform
    ports:
      - '5432:5432'
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
volumes:
  postgres_data:
